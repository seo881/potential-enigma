# Render page images on Linux for changed pages only (Divit, 2026-10-08 launch run, Part 3.2).
# Trigger: a push to main touching specs/, pipeline/briefs/ or status/render-queue.txt, or a manual run with a page list.
# Uses only GITHUB_TOKEN (contents: write) to commit the outputs back; no other secrets.
name: render
on:
  push:
    branches: [main]
    paths: ["specs/**", "pipeline/briefs/**", "status/render-queue.txt"]
  workflow_dispatch:
    inputs:
      pages:
        description: "Comma-separated slugs to render (for example registration-form)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: System packages and the paths bootstrap.sh expects
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q librsvg2-bin fonts-liberation unzip
          sudo mkdir -p /root/.fonts /home/claude/lucide
          sudo chown -R "$USER" /root/.fonts /home/claude && sudo chmod o+rx /root
          # Lucide pinned to the version the approved images were drawn with (pipeline/assets.py); bootstrap.sh then skips its own copy
          cd /home/claude/lucide && npm pack -q lucide-static@1.52.0 >/dev/null && tar xzf lucide-static-1.52.0.tgz
      - name: Bootstrap the image pipeline (pipeline/bootstrap.sh)
        run: bash pipeline/bootstrap.sh
      - name: Render changed pages and run the image gates
        env:
          PAGES: ${{ github.event.inputs.pages }}
        run: |
          if [ -n "$PAGES" ]; then python3 ops/render_changed.py --pages "$PAGES" --force
          else python3 ops/render_changed.py "${{ github.event.before }}" "${{ github.sha }}"; fi
      - name: Upload contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-sheets
          path: /home/claude/review/*.png
          if-no-files-found: ignore
