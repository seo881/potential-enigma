<!-- Emergent playable quiz (Divit 2026-10-14, day step 5; docs/QUIZ.md). Paste into ONE HTML Embed on the SurveyQuiz template.
     Self-contained: no external requests, no libraries. New classes only (.emgq, .emgq-*); no element or existing-class selectors.
     Data: window.awbQuiz, set by the item's hero prompt field (alpb---prompt) in its own script block (id awb-quiz-data); else <script type="application/json" id="emgq-data">, else .emgq-data text.
     Invalid or missing data renders nothing (fail closed; invalid data logs one console warning). -->
<div class="emgq-mount"></div>
<style>
.emgq-src, .emgq-data { display: none !important; }
.emgq-mount:empty { display: none; }
/* Space reservation (Divit 2026-10-23, CLS): on a quiz page (the hero carries the quiz data block) the mount holds the start screen's
   height from first paint, so the quiz rendering at DOMContentLoaded no longer pushes the sections below it down. Measured start screen,
   style-quiz and vocabulary-quiz (the larger kept): 403/438 px at 1440 and 768, 378/435 px at 390. Pages without quiz data: unchanged (no space). */
body:has(#awb-quiz-data) .emgq-mount { display: block; min-height: 438px; }
@media (max-width: 479px) { body:has(#awb-quiz-data) .emgq-mount { min-height: 435px; } }
.emgq { box-sizing: border-box; max-width: 760px; margin: 0 auto; padding: 64px 16px; border: 0; background: transparent; color: #1c1917; font-family: inherit; text-align: left; }
.emgq .emgq-card { box-sizing: border-box; background: #fff; border: 1px solid #f0e6dd; border-radius: 16px; padding: 32px; box-shadow: 0 1px 2px rgba(124, 45, 18, .06), 0 8px 24px rgba(124, 45, 18, .06); }
.emgq .emgq-kicker { margin: 0 0 8px; font-size: 13px; line-height: 1.4; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #9a3412; }
.emgq .emgq-title { margin: 0 0 12px; font-family: inherit; font-size: 28px; line-height: 1.25; font-weight: 600; letter-spacing: 0; color: #1c1917; }
.emgq .emgq-text { margin: 0 0 16px; font-size: 17px; line-height: 1.55; font-weight: 400; color: #44403c; }
.emgq .emgq-meta { margin: 0 0 24px; font-size: 15px; line-height: 1.4; color: #57534e; }
.emgq .emgq-score { margin: 0 0 12px; font-size: 18px; line-height: 1.4; font-weight: 600; color: #1c1917; }
.emgq .emgq-count { margin: 0 0 8px; font-size: 14px; line-height: 1.4; font-weight: 600; color: #9a3412; }
.emgq .emgq-bar { position: relative; height: 8px; margin: 0 0 24px; border-radius: 999px; background: #ffedd5; overflow: hidden; }
.emgq .emgq-fill { display: block; height: 100%; width: 0; border-radius: 999px; background: #c2410c; transition: width .25s ease; }
.emgq .emgq-form { margin: 0; padding: 0; }
.emgq .emgq-fs { min-width: 0; margin: 0; padding: 0; border: 0; }
.emgq .emgq-legend { display: block; float: none; width: 100%; margin: 0 0 16px; padding: 0; border: 0; }
.emgq .emgq-q { margin: 0; font-family: inherit; font-size: 22px; line-height: 1.35; font-weight: 600; letter-spacing: 0; color: #1c1917; }
.emgq .emgq-title:focus, .emgq .emgq-q:focus { outline: none; }
.emgq .emgq-opts { display: grid; gap: 10px; margin: 0 0 20px; padding: 0; }
.emgq .emgq-opt { box-sizing: border-box; display: flex; align-items: center; gap: 12px; min-height: 52px; margin: 0; padding: 14px 16px; border: 1.5px solid #e7ddd4; border-radius: 12px; background: #fff; cursor: pointer; font-size: 17px; line-height: 1.4; font-weight: 400; color: #1c1917; transition: border-color .15s ease, background-color .15s ease; }
.emgq .emgq-opt:hover { border-color: #fb923c; }
.emgq .emgq-opt.emgq-on { border-color: #c2410c; background: #fff7ed; }
.emgq .emgq-opt:focus-within { box-shadow: 0 0 0 3px rgba(194, 65, 12, .35); }
.emgq .emgq-radio { flex: 0 0 20px; width: 20px; height: 20px; margin: 0; padding: 0; accent-color: #c2410c; cursor: pointer; }
.emgq .emgq-radio:focus-visible { outline: 3px solid #c2410c; outline-offset: 2px; }
.emgq .emgq-err { margin: 0 0 16px; font-size: 15px; line-height: 1.4; font-weight: 600; color: #b91c1c; }
.emgq .emgq-err:empty { display: none; }
.emgq .emgq-nav { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.emgq .emgq-nav-end { justify-content: flex-end; }
.emgq .emgq-btn { box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; min-height: 48px; margin: 0; padding: 12px 24px; border: 1.5px solid transparent; border-radius: 999px; font-family: inherit; font-size: 16px; line-height: 1.2; font-weight: 600; text-decoration: none; text-transform: none; cursor: pointer; transition: background-color .15s ease, border-color .15s ease; -webkit-appearance: none; appearance: none; }
.emgq .emgq-primary { background: #c2410c; border-color: #c2410c; color: #fff; }
.emgq .emgq-primary:hover { background: #9a3412; border-color: #9a3412; }
.emgq .emgq-ghost { background: #fff; border-color: #fed7b0; color: #9a3412; }
.emgq .emgq-ghost:hover { border-color: #c2410c; }
.emgq .emgq-btn:focus-visible { outline: 3px solid #1c1917; outline-offset: 2px; }
.emgq .emgq-review { margin: 8px 0 24px; padding: 16px 0 0; border-top: 1px solid #f0e6dd; }
.emgq .emgq-sum { display: list-item; min-height: 24px; padding: 8px 0; cursor: pointer; font-size: 16px; line-height: 1.4; font-weight: 600; color: #9a3412; }
.emgq .emgq-sum:focus-visible { outline: 3px solid #c2410c; outline-offset: 2px; }
.emgq .emgq-list { margin: 12px 0 0; padding: 0 0 0 22px; }
.emgq .emgq-item { margin: 0 0 16px; padding: 0; font-size: 15px; line-height: 1.5; color: #44403c; }
.emgq .emgq-line { margin: 0 0 4px; font-size: 15px; line-height: 1.5; color: #44403c; }
.emgq .emgq-item-q { font-weight: 600; color: #1c1917; }
.emgq .emgq-ok { color: #166534; }
.emgq .emgq-no { color: #b91c1c; }
.emgq .emgq-link { color: #9a3412; text-decoration: underline; }
.emgq .emgq-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
@media (max-width: 479px) {
  .emgq { padding: 40px 16px; }
  .emgq .emgq-card { padding: 20px; border-radius: 14px; }
  .emgq .emgq-title { font-size: 24px; }
  .emgq .emgq-q { font-size: 19px; }
  .emgq .emgq-opt { padding: 12px 14px; font-size: 16px; }
  .emgq .emgq-nav .emgq-btn { flex: 1 1 0; padding: 12px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .emgq .emgq-fill, .emgq .emgq-opt, .emgq .emgq-btn { transition: none; }
}
</style>
<script>
(function () {
  'use strict';
  var LIM = { q: [6, 10], o: [2, 6], r: [2, 6] };
  function str(x) { return typeof x === 'string' && x.replace(/\s+/g, '') !== ''; }
  function whole(x) { return typeof x === 'number' && isFinite(x) && Math.floor(x) === x; }
  function within(n, b) { return n >= b[0] && n <= b[1]; }

  // Runtime validation: anything that would render a broken quiz returns an error and nothing is drawn (fail closed).
  function validate(d) {
    if (!d || typeof d !== 'object' || Array.isArray(d)) return 'not an object';
    if (d.version !== 1) return 'version must be 1';
    if (d.type !== 'knowledge' && d.type !== 'matching') return 'type must be knowledge or matching';
    if (!str(d.title)) return 'title missing';
    if (d.intro != null && typeof d.intro !== 'string') return 'intro must be text';
    var Q = d.questions, R = d.results, i, j;
    if (!Array.isArray(Q) || !within(Q.length, LIM.q)) return 'questions: 6 to 10';
    if (!Array.isArray(R) || !within(R.length, LIM.r)) return 'results: 2 to 6';
    var keys = Object.create(null);
    for (i = 0; i < R.length; i++) {
      var r = R[i];
      if (!r || typeof r !== 'object' || !str(r.key) || !str(r.title) || !str(r.description)) return 'result ' + (i + 1) + ': key, title and description';
      if (keys[r.key]) return 'duplicate result key ' + r.key;
      keys[r.key] = true;
      if (d.type === 'knowledge' && !(whole(r.min) && whole(r.max))) return 'result ' + (i + 1) + ': min and max';
    }
    for (i = 0; i < Q.length; i++) {
      var q = Q[i], nc = 0;
      if (!q || typeof q !== 'object' || !str(q.text) || !Array.isArray(q.options) || !within(q.options.length, LIM.o)) return 'question ' + (i + 1);
      for (j = 0; j < q.options.length; j++) {
        var o = q.options[j];
        if (!o || typeof o !== 'object' || !str(o.text)) return 'question ' + (i + 1) + ' option ' + (j + 1);
        if (d.type === 'knowledge') { if (o.correct === true) nc++; }
        else if (typeof o.result !== 'string' || !keys[o.result]) return 'question ' + (i + 1) + ' option ' + (j + 1) + ': unknown result';
      }
      if (d.type === 'knowledge' && nc !== 1) return 'question ' + (i + 1) + ': exactly one correct option';
    }
    if (d.type === 'knowledge') {
      var seen = [];
      for (i = 0; i < R.length; i++) {
        if (R[i].min < 0 || R[i].max > Q.length || R[i].min > R[i].max) return 'band ' + R[i].key + ' outside 0 to ' + Q.length;
        for (j = R[i].min; j <= R[i].max; j++) { if (seen[j]) return 'bands overlap at ' + j; seen[j] = true; }
      }
      for (j = 0; j <= Q.length; j++) if (!seen[j]) return 'no band for score ' + j;
    }
    return '';
  }

  // Scoring (mirrored in qc/quiz.py score): knowledge = correct answers, result = the band holding them;
  // matching = one point per answer to its result, most points wins, ties go to the result listed first.
  function score(d, ans) {
    var Q = d.questions, R = d.results, i, pts = 0;
    if (d.type === 'knowledge') {
      for (i = 0; i < Q.length; i++) { var o = Q[i].options[ans[i]]; if (o && o.correct === true) pts++; }
      for (i = 0; i < R.length; i++) if (pts >= R[i].min && pts <= R[i].max) return { key: R[i].key, points: pts, of: Q.length };
      return null;
    }
    var tally = Object.create(null), best = null;
    for (i = 0; i < Q.length; i++) { var p = Q[i].options[ans[i]]; if (p) tally[p.result] = (tally[p.result] || 0) + 1; }
    for (i = 0; i < R.length; i++) if (best === null || (tally[R[i].key] || 0) > (tally[best] || 0)) best = R[i].key;
    return { key: best, points: tally[best] || 0, of: Q.length };
  }

  var API = { validate: validate, score: score };
  if (typeof document === 'undefined') { if (typeof module === 'object' && module) module.exports = API; return; }

  function warn(m) { try { console.warn('[emgq] quiz not rendered: ' + m); } catch (e) {} }
  function read() {
    var raw = window.awbQuiz, el;
    if (raw == null) {
      el = document.getElementById('emgq-data') || document.querySelector('.emgq-data');
      if (!el) return null;
      raw = el.textContent;
    }
    if (typeof raw === 'string') {
      if (!str(raw)) return null;
      try { raw = JSON.parse(raw); } catch (e) { warn('invalid JSON'); return null; }
    }
    var err = validate(raw);
    if (err) { warn(err); return null; }
    return raw;
  }

  var uid = 0;
  function mk(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function btn(cls, text, type) { var b = mk('button', 'emgq-btn ' + cls, text); b.type = type || 'button'; return b; }

  function Quiz(mount, d) {
    var id = 'emgq-' + (++uid), N = d.questions.length, st = { i: -1, ans: [] };
    var root = mk('section', 'emgq'), card = mk('div', 'emgq-card'), live = mk('div', 'emgq-sr');
    root.setAttribute('aria-label', d.title);
    live.setAttribute('role', 'status'); live.setAttribute('aria-live', 'polite');
    root.appendChild(card); root.appendChild(live); mount.appendChild(root);

    function say(t) { live.textContent = ''; setTimeout(function () { live.textContent = t; }, 50); }
    function focus(el) { try { el.focus({ preventScroll: false }); } catch (e) { el.focus(); } }
    function clear() { while (card.firstChild) card.removeChild(card.firstChild); }

    function start(move) {
      st.i = -1; clear();
      var h = mk('h2', 'emgq-title', d.title); h.tabIndex = -1; h.id = id + '-t';
      card.appendChild(h);
      if (str(d.intro)) card.appendChild(mk('p', 'emgq-text', d.intro));
      card.appendChild(mk('p', 'emgq-meta', N + ' questions, one at a time'));
      var go = btn('emgq-primary', 'Start the quiz');
      go.addEventListener('click', function () { question(0); });
      card.appendChild(go);
      if (move) focus(h);
    }

    function question(i) {
      st.i = i; clear();
      var q = d.questions[i], name = id + '-q' + i, hid = id + '-h' + i;
      var count = mk('p', 'emgq-count', 'Question ' + (i + 1) + ' of ' + N);
      var bar = mk('div', 'emgq-bar'), fill = mk('span', 'emgq-fill');
      bar.setAttribute('role', 'progressbar'); bar.setAttribute('aria-label', 'Quiz progress');
      bar.setAttribute('aria-valuemin', '0'); bar.setAttribute('aria-valuemax', String(N));
      bar.setAttribute('aria-valuenow', String(i + 1)); bar.setAttribute('aria-valuetext', 'Question ' + (i + 1) + ' of ' + N);
      fill.style.width = Math.round((i + 1) / N * 100) + '%';
      bar.appendChild(fill); card.appendChild(count); card.appendChild(bar);

      var form = mk('form', 'emgq-form'), fs = mk('fieldset', 'emgq-fs'), lg = mk('legend', 'emgq-legend');
      form.noValidate = true;
      var h = mk('h3', 'emgq-q', q.text); h.tabIndex = -1; h.id = hid;
      lg.appendChild(h); fs.appendChild(lg);
      var opts = mk('div', 'emgq-opts'), labels = [];
      q.options.forEach(function (o, j) {
        var lab = mk('label', 'emgq-opt'), r = mk('input', 'emgq-radio');
        r.type = 'radio'; r.name = name; r.value = String(j); r.id = name + '-o' + j;
        lab.htmlFor = r.id;
        if (st.ans[i] === j) { r.checked = true; lab.className += ' emgq-on'; }
        lab.appendChild(r); lab.appendChild(mk('span', 'emgq-opt-text', o.text));
        opts.appendChild(lab); labels.push(lab);
      });
      fs.appendChild(opts); form.appendChild(fs);
      var err = mk('p', 'emgq-err'); err.id = name + '-err'; err.setAttribute('role', 'alert');
      form.appendChild(err);
      opts.addEventListener('change', function (e) {
        var v = parseInt(e.target.value, 10); if (isNaN(v)) return;
        st.ans[i] = v; err.textContent = ''; fs.removeAttribute('aria-describedby');
        labels.forEach(function (l, j) { l.className = 'emgq-opt' + (j === v ? ' emgq-on' : ''); });
      });
      var nav = mk('div', 'emgq-nav');
      var back = btn('emgq-ghost', 'Back');
      back.addEventListener('click', function () { if (i === 0) start(true); else question(i - 1); });
      var next = btn('emgq-primary', i === N - 1 ? 'See my result' : 'Next question', 'submit');
      nav.appendChild(back); nav.appendChild(next); form.appendChild(nav);
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (st.ans[i] == null) {
          err.textContent = 'Choose an answer to continue.'; fs.setAttribute('aria-describedby', err.id);
          var first = form.querySelector('.emgq-radio'); if (first) focus(first);
          return;
        }
        if (i === N - 1) result(); else question(i + 1);
      });
      card.appendChild(form);
      say('Question ' + (i + 1) + ' of ' + N);
      focus(h);
    }

    function result() {
      st.i = N; clear();
      var res = score(d, st.ans), R = null;
      for (var k = 0; k < d.results.length; k++) if (d.results[k].key === res.key) R = d.results[k];
      if (!R) { warn('no result for these answers'); return; }
      card.appendChild(mk('p', 'emgq-kicker', 'Your result'));
      var h = mk('h2', 'emgq-title', R.title); h.tabIndex = -1; h.id = id + '-r';
      card.appendChild(h);
      if (d.type === 'knowledge') card.appendChild(mk('p', 'emgq-score', 'You got ' + res.points + ' of ' + res.of + ' right.'));
      card.appendChild(mk('p', 'emgq-text', R.description));
      review();
      var nav = mk('div', 'emgq-nav emgq-nav-end'), again = btn('emgq-primary', 'Take the quiz again');
      again.addEventListener('click', function () { st.ans = []; question(0); });
      nav.appendChild(again); card.appendChild(nav);
      say('Your result: ' + R.title + (d.type === 'knowledge' ? '. You got ' + res.points + ' of ' + res.of + ' right.' : ''));
      focus(h);
    }

    function review() {
      var know = d.type === 'knowledge', any = know;
      d.questions.forEach(function (q) { if (str(q.explanation)) any = true; });
      if (!any) return;
      var det = mk('details', 'emgq-review'), sum = mk('summary', 'emgq-sum', know ? 'Check your answers' : 'See your answers');
      var ol = mk('ol', 'emgq-list');
      d.questions.forEach(function (q, i) {
        var li = mk('li', 'emgq-item'), mine = q.options[st.ans[i]], right = null;
        q.options.forEach(function (o) { if (o.correct === true) right = o; });
        li.appendChild(mk('p', 'emgq-line emgq-item-q', q.text));
        if (know) {
          var ok = mine === right;
          li.appendChild(mk('p', 'emgq-line ' + (ok ? 'emgq-ok' : 'emgq-no'), (ok ? 'Correct: ' : 'Your answer: ') + (mine ? mine.text : '')));
          if (!ok) li.appendChild(mk('p', 'emgq-line', 'Answer: ' + right.text));
        } else li.appendChild(mk('p', 'emgq-line', 'Your answer: ' + (mine ? mine.text : '')));
        if (str(q.explanation)) li.appendChild(mk('p', 'emgq-line', q.explanation));
        var s = q.source;
        if (s && typeof s.url === 'string' && /^https:\/\/[^\s"'<>]+$/.test(s.url)) {
          var host = ''; try { host = new URL(s.url).hostname.replace(/^www\./, ''); } catch (e) { host = ''; }
          if (host) {
            var p = mk('p', 'emgq-line'), a = mk('a', 'emgq-link', 'Source: ' + host);
            a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow';
            p.appendChild(a); li.appendChild(p);
          }
        }
        ol.appendChild(li);
      });
      det.appendChild(sum); det.appendChild(ol); card.appendChild(det);
    }

    start(false);
  }

  function init() {
    var mount = document.querySelector('.emgq-mount');
    if (!mount || mount.getAttribute('data-emgq-done')) return;
    var d = read(); if (!d) return;
    mount.setAttribute('data-emgq-done', '1');
    try { Quiz(mount, d); } catch (e) { while (mount.firstChild) mount.removeChild(mount.firstChild); warn('render error'); }
  }
  // the carrier field may render below this embed: read the data once the document is parsed
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
